# Amiga demoscene productions running in FS-UAE. The demos are downloaded the
# first time this source is used. As a screensaver it goes through every demo.
name=Amiga Demos
icon=󰊖
description=Classic Amiga demos running in an emulator
order=20
outputs=each
placements=background screensaver
input=dismiss
needs=fs-uae jq curl bsdtar
packages=fs-uae

# Settings this source reads (override them in ~/.config/omarchy/ambient/amiga.conf)
pack_url=https://github.com/avillagran/omarchy-amiga/raw/main/selection/amiga-screensaver-selection.zip
pack_sha256=c5bc1e2c83b043a3be09659787583759d9f614c9e7411045b87200e64d5572be
pack_size=14 MB
# As a screensaver: the longest any demo plays, and how long the next one
# restores its state before the last one ends.
max_demo_seconds=600
transition_seconds=3
