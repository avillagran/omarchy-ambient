# The Omarchy screensaver's ttfx effects, drawn on the GPU by
# omarchy-ttfx-layer: as the background, or as the screensaver itself.
name=Omarchy Effects
icon=󱄄
description=The Omarchy screensaver effects, drawn on the GPU
order=5
outputs=each
placements=background screensaver
input=dismiss

# Settings this source reads (override them in ~/.config/omarchy/ambient/ttfx.conf)
effects=matrix,decrypt,rings,thunderstorm,fireworks,rain
# Seconds each effect stays on screen.
rotate=30
# auto lets each effect run at its own pace, as fast as this machine affords
# (20 fps up to the display's refresh rate); a number caps it.
fps=auto
# Empty uses ~/.config/omarchy/branding/screensaver.txt when present.
text=
# Explicit text_file takes priority over text.
text_file=
# Cell size: 1 is the finest grid, 8 the coarsest and cheapest.
resolution=2
# 1 makes the effects react to what is playing.
audio=1
# Path to omarchy-ttfx-layer when it is not on PATH or in the audio-background plugin.
binary=
